name: Testy Quizowni

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Integracja i E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: quizownia-ci
      PLAYWRIGHT_BASE_URL: http://frontend

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Uruchom PHP, Apache i MySQL
        run: |
          docker compose up -d --build --wait --wait-timeout 120 frontend backend db
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            --max-time 5 http://127.0.0.1:8080/api/ |
            jq -e '.database == "connected" and .quizzes == 25'

      - name: Uruchom testy Playwrighta
        id: playwright
        run: |
          version=$(jq -er '.devDependencies["@playwright/test"]' tests/package.json)
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            --env HOME=/tmp --env CI=true --env PLAYWRIGHT_BASE_URL \
            --volume "${GITHUB_WORKSPACE}/tests:/tests" --workdir /tests \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            sh -ec 'npm ci && npm test'

      - name: Prześlij raport i ślady błędów
        if: ${{ !cancelled() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: raport-testow
          path: |
            tests/playwright-report/
            tests/test-results/

      - name: Pokaż logi usług po błędzie
        if: ${{ failure() }}
        run: docker compose logs --no-color frontend backend db

      - name: Zatrzymaj środowisko testowe
        if: ${{ always() }}
        run: docker compose down --volumes
