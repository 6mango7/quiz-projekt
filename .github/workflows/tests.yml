name: Testy Quizowni

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Integracja i E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: quizownia-ci
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Wybierz testy na podstawie zmian w PR-ze
        id: selection
        run: |
          api=true
          e2e=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changes=$(mktemp)
            trap 'rm -f -- "$changes"' EXIT
            # Porównaj testowany commit scalający z gałęzią bazową.
            if git diff --name-only -z --no-renames HEAD^1 HEAD -- > "$changes"; then
              api=false
              e2e=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|instrukcja-galezie.pdf|.gitignore) ;;
                  tests/api.spec.js) api=true ;;
                  frontend/.htaccess|frontend/*/.htaccess) api=true; e2e=true ;;
                  frontend/css/*|frontend/img/*|frontend/includes/*|frontend/js/*|frontend/*.php|tests/*-e2e.spec.js)
                    e2e=true ;;
                  *) api=true; e2e=true ;;
                esac
              done < "$changes"
            else
              echo 'Nie udało się odczytać zmian w PR-ze. Uruchomię oba zestawy.'
            fi
          fi
          printf 'api=%s\ne2e=%s\n' "$api" "$e2e" >> "$GITHUB_OUTPUT"
          if [[ "$api" == false && "$e2e" == false ]]; then
            echo 'Zmiany w PR-ze nie wymagają testów API ani E2E.'
          fi

      - name: Zainstaluj zależności testów
        if: steps.selection.outputs.api == 'true' || steps.selection.outputs.e2e == 'true'
        working-directory: tests
        run: npm ci

      - name: Zainstaluj headless Chromium
        if: steps.selection.outputs.e2e == 'true'
        working-directory: tests
        run: npx playwright install --only-shell chromium

      - name: Uruchom PHP, Apache i MySQL
        id: compose
        if: steps.selection.outputs.api == 'true' || steps.selection.outputs.e2e == 'true'
        env:
          RUN_API: ${{ steps.selection.outputs.api }}
        run: |
          docker compose up -d --build --wait --wait-timeout 120 frontend backend db
          ready_path=/
          if [[ "$RUN_API" == true ]]; then
            ready_path=/api/
          fi
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            --max-time 5 --output /dev/null "${PLAYWRIGHT_BASE_URL}${ready_path}"

      - name: Uruchom testy Playwrighta
        id: playwright
        if: steps.selection.outputs.api == 'true' || steps.selection.outputs.e2e == 'true'
        working-directory: tests
        env:
          RUN_API: ${{ steps.selection.outputs.api }}
          RUN_E2E: ${{ steps.selection.outputs.e2e }}
        run: |
          if [[ "$RUN_API" == true && "$RUN_E2E" == true ]]; then
            npm test
          elif [[ "$RUN_API" == true ]]; then
            npm test -- '(^|/)api\.spec\.js$'
          else
            npm test -- '(^|/)[^/]+-e2e\.spec\.js$'
          fi

      - name: Prześlij raport i ślady błędów
        if: ${{ !cancelled() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: raport-testow
          path: |
            tests/playwright-report/
            tests/test-results/

      - name: Pokaż logi usług po błędzie
        if: ${{ failure() && (steps.compose.outcome == 'success' || steps.compose.outcome == 'failure') }}
        run: docker compose logs --no-color frontend backend db

      - name: Zatrzymaj środowisko testowe
        if: ${{ always() && steps.compose.outcome != '' && steps.compose.outcome != 'skipped' }}
        run: docker compose down --volumes
