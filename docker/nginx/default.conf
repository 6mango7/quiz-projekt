# Serwer frontendu (nginx)
#  - pliki z folderu frontend/ wysyła prosto do przeglądarki
#  - adresy zaczynające się od /api/ przekazuje do backendu (PHP)
# Dzięki temu przeglądarka widzi jedną stronę (localhost:8080) i ciasteczko logowania działa bez CORS.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # quiz może mieć dużo zdjęć naraz
    client_max_body_size 100m;

    # /api/quizzes.php  ->  http://backend/quizzes.php
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # gdy zrobicie własną stronę 404, odkomentujcie:
    # error_page 404 /404.html;
}
