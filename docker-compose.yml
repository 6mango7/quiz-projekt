# quiz-projekt – frontend i backend osobno:
#   frontend    – nginx: strony HTML, CSS, JS      → http://localhost:8080
#                 adresy /api/... przekazuje do backendu
#   backend     – Apache + PHP: API zwracające JSON → http://localhost:8000
#   db          – baza danych MySQL
#   phpmyadmin  – podgląd bazy w przeglądarce       → http://localhost:8081
#
# Uruchomienie:  docker compose up -d --build
# Zatrzymanie:   docker compose down
# Baza od nowa:  docker compose down -v   (kasuje dane!), potem znowu up

services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro                         # strony – zmiany widać od razu
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: ./docker/backend
    ports:
      - "8000:80"
    environment:
      TZ: Europe/Warsaw
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quizownia
      MYSQL_USER: quiz        # tego użytkownika używa backend (backend/includes/db.php)
      MYSQL_PASSWORD: quiz123
      TZ: Europe/Warsaw       # NOW() w bazie = czas polski, tak samo jak w PHP
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_polish_ci
    volumes:
      - dane-bazy:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d   # pliki .sql wgrywają się same przy pierwszym uruchomieniu
    healthcheck:
      # 127.0.0.1 (a nie localhost) – odpowiada dopiero, gdy pliki .sql są już wgrane
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: quiz          # logowanie automatyczne
      PMA_PASSWORD: quiz123
    depends_on:
      db:
        condition: service_healthy

volumes:
  dane-bazy:
