# quiz-projekt – frontend i backend osobno:
#   frontend    – Apache + PHP: strony, CSS, JS     → http://localhost:8080
#                 adresy /api/... przekazuje do backendu
#   backend     – Apache + PHP: API zwracające JSON → http://localhost:8000
#   db          – baza danych MySQL
#   phpmyadmin  – podgląd bazy w przeglądarce       → http://localhost:8081
#
# Uruchomienie:  docker compose up -d --build
# Zatrzymanie:   docker compose down
# Baza od nowa:  docker compose down -v   (kasuje dane!), potem znowu up

services:
  frontend:
    build: ./docker/frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/html

  backend:
    build: ./docker/backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quizownia
      MYSQL_USER: quiz
      MYSQL_PASSWORD: quiz123
      TZ: Europe/Warsaw
    volumes:
      - dane-bazy:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: quiz
      PMA_PASSWORD: quiz123
    depends_on:
      db:
        condition: service_healthy

volumes:
  dane-bazy:
