<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quizownia – quizy w formie turnieju. W każdej rundzie wybierasz jedną z dwóch opcji, aż zostanie zwycięzca."
    />
    <title>Quizownia</title>

    <!-- Czcionka -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Ustawia motyw przed załadowaniem Reacta, żeby strona nie mrugała -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('quizownia:theme') || 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
